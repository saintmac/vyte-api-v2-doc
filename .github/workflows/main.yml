name: Build and Deploy
on:
  push:
    branches: [master]

# Allow the deploy to push to the gh-pages branch via GITHUB_TOKEN.
permissions:
  contents: write

# Avoid overlapping production deploys clobbering each other.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install & build
        env:
          # VuePress 1.x / webpack 4 needs the legacy OpenSSL provider on Node 17+.
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          yarn install
          yarn build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/.vuepress/dist
          # Preserve PR preview folders published by pr-preview.yml; the deploy
          # otherwise cleans files on gh-pages that aren't in the new build.
          # The CNAME lives in docs/.vuepress/public/CNAME so it ships in the build.
          clean-exclude: pr-preview/
