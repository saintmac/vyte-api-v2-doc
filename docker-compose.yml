services:
  # Dev server with hot reload — no local node/vuepress needed:
  #   npm start   (= docker compose up dev)
  # then open http://localhost:8080
  dev:
    # Node 14 to match CI: node-sass@4.14.1 (transitive VuePress 1.x dep) only
    # ships prebuilt binaries through Node 14, and none for linux/arm64, so we
    # force amd64 (emulated on Apple Silicon) instead of compiling from source.
    image: node:14
    platform: linux/amd64
    working_dir: /app
    command: sh -c "yarn install && yarn dev --host 0.0.0.0 --port 8080"
    environment:
      # Chromium is only used by `vuepress export` (PDF), not by the dev server.
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      # keep the container's (Linux) node_modules off the host bind mount
      - node_modules:/app/node_modules

volumes:
  node_modules:
